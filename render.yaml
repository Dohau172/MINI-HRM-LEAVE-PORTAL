databases:
  - name: mini-hrm-db
    databaseName: mini_hrm_leave
    user: postgres
    plan: free
    region: singapore

services:
  # 1. Dịch vụ Backend (NestJS REST API)
  - type: web
    name: mini-hrm-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run prisma:seed && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: mini-hrm-db
          property: connectionString
      - key: JWT_SECRET
        value: super-secret-mini-hrm-key-2026
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: ./uploads

  # 2. Dịch vụ Frontend (React + Vite Static Site)
  - type: web
    name: mini-hrm-frontend
    env: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
